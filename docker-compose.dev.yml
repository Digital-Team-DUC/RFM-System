services:
  postgres:
    image: postgres:16-alpine
    container_name: rfm_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: rfm_user
      POSTGRES_PASSWORD: rfm_secure_password_2026
      POSTGRES_DB: rfm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfm_user -d rfm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rfm_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  redis_dev_data:
