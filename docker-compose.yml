services:
  database:
    image: postgres:16-alpine
    container_name: rfm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-rfm_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-rfm_secure_password_2026}
      POSTGRES_DB: ${DATABASE_NAME:-rfm_db}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-rfm_user} -d ${DATABASE_NAME:-rfm_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rfm_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: rfm_backend:latest
    container_name: rfm_backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${DATABASE_USER:-rfm_user}:${DATABASE_PASSWORD:-rfm_secure_password_2026}@database:5432/${DATABASE_NAME:-rfm_db}?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BACKEND_PORT: 4000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-rfm_enterprise_jwt_access_super_secret_key_2026_xyz!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-rfm_enterprise_jwt_refresh_super_secret_key_2026_xyz!}
      CORS_ORIGIN: "*"
    ports:
      - "4000:4000"

  worker:
    image: rfm_backend:latest
    container_name: rfm_worker
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${DATABASE_USER:-rfm_user}:${DATABASE_PASSWORD:-rfm_secure_password_2026}@database:5432/${DATABASE_NAME:-rfm_db}?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: ["node", "dist/src/main.js"]

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: rfm_frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  proxy:
    image: nginx:alpine
    container_name: rfm_proxy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  postgres_data:
  redis_data:


